<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EDT Enzo">
<meta name="description" content="Emploi du temps mobile avec alternance Q1/Q2.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Emploi du temps d’Enzo</title>
<style>
:root{color-scheme:dark;--bg:#0f172a;--panel:#182233;--text:#f8fafc;--muted:#b9c5d5;--border:#334155;--accent:#a9d6fc;--current:#88d1bf}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.4}button,input{font:inherit}button{min-height:44px;border:1px solid var(--border);border-radius:12px;padding:9px 12px;background:var(--panel);color:var(--text);cursor:pointer}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button[aria-pressed="true"]{background:#284d6a;border-color:#95c7ef}button:disabled{opacity:.4;cursor:default}[hidden]{display:none!important}
.app{max-width:760px;margin:auto;padding:20px 14px calc(24px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;gap:12px;margin-bottom:18px}header img{width:48px;height:48px;border-radius:12px}h1{font-size:1.35rem;line-height:1.2;margin:0 0 4px}h2{font-size:1.15rem;margin:0}h3{font-size:1rem;margin:0 0 10px}.muted{color:var(--muted);font-size:.8rem}.weekbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;margin-bottom:12px}.weekbar button{font-size:1.2rem;padding:4px}.weekinfo{text-align:center}.badge{display:inline-block;font-weight:800;color:var(--accent);font-size:.85rem;margin-bottom:3px}.weekdates{font-size:.86rem}
.toolbar{display:flex;gap:8px;margin:12px 0}.toolbar button{flex:1;font-size:.84rem;font-weight:650}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0 18px}.days button{padding:8px 2px;font-weight:750}.days small{display:block;font-weight:400;font-size:.73rem;color:var(--muted);margin-top:2px}.heading{margin-bottom:12px}.heading .muted{margin-top:4px}.list{display:grid;gap:10px}.row{display:grid;grid-template-columns:56px minmax(0,1fr);gap:9px}.time{padding-top:11px;text-align:center;font-weight:800;font-size:.84rem}.time small{display:block;color:var(--muted);font-weight:450;font-size:.73rem;margin-top:3px}.lesson{border:1px solid var(--border);border-left:6px solid var(--c);background:var(--panel);background:color-mix(in srgb,var(--c) 19%,var(--panel));border-radius:12px;padding:11px 12px;min-width:0}.subject{font-weight:780;line-height:1.25}.meta{color:#d2dae5;font-size:.76rem;margin-top:5px;overflow-wrap:anywhere}.q{display:inline-block;border:1px solid #9aabc0;border-radius:30px;padding:1px 6px;font-size:.62rem;vertical-align:2px;margin-left:6px;white-space:nowrap}/* Repère vert d’eau, sans animation : la couleur de la matière est conservée. */
.current .lesson{outline:3px solid var(--current);outline-offset:1px;box-shadow:0 0 0 5px rgba(136,209,191,.10),0 5px 16px rgba(136,209,191,.08)}.current .time,.current .time small{color:var(--current)}.current-label{display:inline-block;margin-top:8px;padding:2px 8px;border:1px solid #568d80;border-radius:30px;background:#294a43;color:#c0efdf;font-size:.65rem;font-weight:750;letter-spacing:.03em}
.gap{margin:0 0 0 65px;padding:3px 0;color:var(--muted);font-size:.74rem}.live{background:#20394c;border:1px solid #537790;border-radius:12px;padding:12px 14px;margin-bottom:14px}.live strong{display:block;font-size:.8rem;color:var(--accent);margin-bottom:4px}.empty{padding:20px;background:var(--panel);border:1px dashed var(--border);border-radius:12px;text-align:center}.weeklist{display:grid;gap:22px}.daysection h3 small{font-size:.75rem;font-weight:400;color:var(--muted)}.endday{margin:12px 0 0 65px;color:var(--muted);font-size:.8rem}
.actions{display:flex;gap:8px;margin-top:20px}.actions button{flex:1;font-size:.83rem}#install{background:#284d6a}#shareLink{width:100%;padding:10px;margin-top:10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text)}#notice:empty{display:none}#notice{margin:8px 0;min-height:1.4em;color:var(--accent);font-size:.8rem}@media(min-width:650px){.app{padding:26px}.weeklist{grid-template-columns:1fr 1fr}.daysection .row{grid-template-columns:50px minmax(0,1fr)}.daysection .gap,.daysection .endday{margin-left:59px}}@media(max-width:350px){h1{font-size:1.18rem}.app{padding-left:10px;padding-right:10px}.toolbar{gap:5px}.toolbar button{padding:8px 5px}.lesson{padding:10px}.row{gap:6px;grid-template-columns:50px minmax(0,1fr)}}
.gap.lunch{padding:10px 12px;border:1px solid #485967;border-radius:10px;background:#1d2b37;color:#d2dfe6;display:grid;gap:2px}.gap.lunch strong{font-size:.78rem;font-weight:650}.gap.lunch small{color:var(--muted);font-size:.73rem}.live.is-current{border-color:var(--current);box-shadow:0 0 0 1px var(--current),0 4px 14px rgba(136,209,191,.10);background:#20373b}.live.is-current strong{color:#b0ecde}
@media(max-width:350px){.gap,.endday{margin-left:56px}}
</style>
</head>
<body>
<main class="app">
<header><img src="./icon-192.png" alt="" width="48" height="48"><div><h1>Emploi du temps d’Enzo</h1><div class="muted">5JACI · Collège Alexandre Macal</div></div></header>
<nav class="weekbar" aria-label="Choisir la semaine"><button id="prev" aria-label="Semaine précédente">‹</button><div class="weekinfo"><div class="badge" id="cycle"></div><div class="weekdates" id="weekDates"></div></div><button id="next" aria-label="Semaine suivante">›</button></nav>
<div class="toolbar"><button id="today">Aujourd’hui</button><button id="viewDay" aria-pressed="true">Journée</button><button id="viewWeek" aria-pressed="false">Semaine</button></div>
<nav class="days" aria-label="Choisir un jour"><button data-day="0">Lun<small></small></button><button data-day="1">Mar<small></small></button><button data-day="2">Mer<small></small></button><button data-day="3">Jeu<small></small></button><button data-day="4">Ven<small></small></button></nav>
<section class="heading"><h2 id="title"></h2><div id="status" class="muted"></div></section>
<div id="live" class="live" hidden></div>
<section id="content" aria-label="Cours"></section>
<div class="actions"><button id="install" hidden>Installer l’application</button><button id="share">Partager le lien</button></div>
<input id="shareLink" aria-label="Lien de l’application à copier" readonly hidden>
<div id="notice" role="status" aria-live="polite"></div>
<noscript><p>Activer JavaScript dans le navigateur pour afficher l’emploi du temps.</p></noscript>
</main>
<script>
'use strict';
(() => {
// [début, fin, matière, professeur, salle, alternance (0=toutes les semaines)].
const subjects={svt:['SVT','#7aaa72'],fr:['Français','#78afb2'],eps:['EPS','#7776b7'],en:['Anglais LV1','#d3bb74'],math:['Mathématiques','#b9a8bb'],tech:['Technologie','#b8aa69'],es:['Espagnol LV2','#c2a9b0'],pc:['Physique-Chimie','#b59db1'],arts:['Arts plastiques','#d2a36f'],hist:['Histoire-Géographie','#6388b3'],mus:['Éducation musicale','#b99faf'],emc:['EMC','#5593bd'],theatre:['Théâtre','#9d6077']};
const lessons=[
[['07:30','08:25','svt','Oulebsir I.','107',0],['08:25','09:25','fr','Ganry A.','215',0],['09:40','11:30','eps','Bodot Y.','',0],['13:30','14:25','fr','Ganry A.','215',0],['14:25','15:25','en','Roche F.','219',0],['15:40','16:35','math','Palengat-Kuhn V.','111',1],['15:40','16:35','hist','Depreux V.','203',2]],
[['07:30','08:25','en','Roche F.','219',1],['07:30','08:25','math','Palengat-Kuhn V.','111',2],['08:25','09:25','tech','Permal A.','103',1],['08:25','09:25','fr','Ganry A.','215',2],['09:40','10:35','es','Robalo-Costa D.','211',0],['10:35','11:30','arts','Iriarte J.','114',0],['13:30','14:25','pc','Bre A.','115',0],['14:25','15:25','hist','Depreux V.','203',0],['15:40','16:35','emc','Depreux V.','203',2]],
[['07:30','08:25','pc','Bre A.','115',1],['07:30','08:25','math','Palengat-Kuhn V.','111',2],['08:25','09:25','es','Robalo-Costa D.','211',1],['08:25','10:35','eps','Bodot Y.','',2],['09:40','10:35','fr','Ganry A.','215',1],['10:35','11:30','fr','Ganry A.','215',1],['10:35','11:30','en','Roche F.','219',2],['11:35','12:30','math','Palengat-Kuhn V.','111',2]],
[['07:30','08:25','tech','Permal A.','103',0],['08:25','09:25','fr','Ganry A.','215',1],['08:25','09:25','es','Robalo-Costa D.','211',2],['09:40','10:35','math','Palengat-Kuhn V.','111',0],['10:35','11:30','mus','Diaz C.','113',0],['13:30','14:25','svt','Oulebsir I.','107',1],['13:30','14:25','es','Robalo-Costa D.','211',2],['14:25','15:25','en','Roche F.','219',0]],
[['08:25','09:25','math','Palengat-Kuhn V.','111',0],['09:40','10:35','hist','Depreux V.','203',0],['14:25','15:25','fr','Ganry A.','215',0],['15:40','16:35','theatre','Ganry A.','104',0]]
];
const DAY=86400000, REF=Date.UTC(2026,8,7), $=id=>document.getElementById(id);
const localClock=new Intl.DateTimeFormat('en-GB',{timeZone:'America/Guadeloupe',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
const shortDate=new Intl.DateTimeFormat('fr-FR',{timeZone:'UTC',day:'numeric',month:'short'});
const longDate=new Intl.DateTimeFormat('fr-FR',{timeZone:'UTC',weekday:'long',day:'numeric',month:'long'});
function now(){const p=Object.fromEntries(localClock.formatToParts(new Date()).map(x=>[x.type,x.value]));return {date:Date.UTC(+p.year,+p.month-1,+p.day),minutes:+p.hour*60+(+p.minute)};}
function dayIndex(date){return (new Date(date).getUTCDay()+6)%7;}
function monday(date){return date-dayIndex(date)*DAY;}
function cycle(date){return ((Math.round((monday(date)-REF)/(7*DAY))%2)+2)%2===0?2:1;}
function minutes(time){const [h,m]=time.split(':').map(Number);return h*60+m;}
function courses(day,q){return (lessons[day]||[]).filter(c=>c[5]===0||c[5]===q);}
function el(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node;}
let selected=now().date, mode='day', followToday=true, lastDate=now().date;
// Une pause entre la matinée et l’après-midi inclut la cantine.
// Ses bornes restent celles des cours ; aucun horaire de service n’est inventé.
function isLunchBreak(start,end){return minutes(start)<13*60&&minutes(end)>=13*60;}
function courseList(day,date){
  const q=cycle(date),items=courses(day,q),list=el('div','list'),clock=now();
  items.forEach((c,i)=>{
    if(i&&minutes(c[0])-minutes(items[i-1][1])>=30){
      const start=items[i-1][1],end=c[0],lunch=isLunchBreak(start,end);
      const gap=el('div',lunch?'gap lunch':'gap');
      if(lunch){gap.append(el('strong','','Pause méridienne · Cantine'),el('small','',start+' – '+end));}
      else{gap.textContent=start+' – '+end+' · Créneau sans cours';}
      list.append(gap);
    }
    const row=el('div','row');
    const current=date===clock.date&&clock.minutes>=minutes(c[0])&&clock.minutes<minutes(c[1]);
    if(current){row.classList.add('current');row.setAttribute('aria-current','true');}
    const time=el('div','time',c[0]);time.append(el('small','',c[1]));
    const card=el('article','lesson');card.style.setProperty('--c',subjects[c[2]][1]);
    const title=el('div','subject',subjects[c[2]][0]);
    if(c[5])title.append(el('span','q','Q'+c[5]));
    card.append(title,el('div','meta',c[3]+(c[4]?' · Salle '+c[4]:'')));
    if(current)card.append(el('span','current-label','En cours'));
    row.append(time,card);list.append(row);
  });
  if(items.length)list.append(el('div','endday','Fin des cours : '+items[items.length-1][1]));
  else list.append(el('div','empty','Aucun cours prévu le week-end.'));
  return list;
}
function render(){const q=cycle(selected),mon=monday(selected),d=dayIndex(selected),clock=now();$('cycle').textContent='Semaine Q'+q;$('weekDates').textContent=shortDate.format(mon)+' – '+shortDate.format(mon+6*DAY)+' '+new Date(mon+6*DAY).getUTCFullYear();document.querySelectorAll('[data-day]').forEach(b=>{const i=+b.dataset.day;b.querySelector('small').textContent=new Date(mon+i*DAY).getUTCDate();b.setAttribute('aria-pressed',String(mode==='day'&&d===i));b.setAttribute('aria-label',longDate.format(mon+i*DAY));});$('viewDay').setAttribute('aria-pressed',String(mode==='day'));$('viewWeek').setAttribute('aria-pressed',String(mode==='week'));const content=$('content');content.replaceChildren();const box=$('live');box.hidden=true;box.classList.remove('is-current');box.replaceChildren();if(mode==='week'){$('title').textContent='Semaine complète';$('status').textContent='Q'+q+' · Planning habituel, hors modifications du collège';const week=el('div','weeklist');for(let i=0;i<5;i++){const section=el('section','daysection');section.append(el('h3','',longDate.format(mon+i*DAY)),courseList(i,mon+i*DAY));week.append(section);}content.append(week);return;}const items=courses(d,q);$('title').textContent=(selected===clock.date?'Aujourd’hui · ':'')+longDate.format(selected);$('status').textContent='Q'+q+' · '+items.length+' cours'+(items.length?' · '+items[0][0]+' – '+items[items.length-1][1]:'');content.append(courseList(d,selected));if(selected===clock.date&&items.length){const current=items.find(c=>clock.minutes>=minutes(c[0])&&clock.minutes<minutes(c[1]));const next=items.find(c=>minutes(c[0])>clock.minutes);const c=current||next;if(c){box.classList.toggle('is-current',Boolean(current));box.append(el('strong','',current?'En cours · jusqu’à '+c[1]:'Prochain cours · '+c[0]),el('div','',subjects[c[2]][0]+(c[4]?' · Salle '+c[4]:'')));box.hidden=false;}}}
document.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{selected=monday(selected)+Number(b.dataset.day)*DAY;mode='day';followToday=false;render();}));$('prev').onclick=()=>{selected-=7*DAY;followToday=false;render();};$('next').onclick=()=>{selected+=7*DAY;followToday=false;render();};$('today').onclick=()=>{selected=now().date;followToday=true;mode='day';render();};$('viewDay').onclick=()=>{mode='day';render();};$('viewWeek').onclick=()=>{mode='week';render();};
function refresh(){const today=now().date;if(followToday&&today!==lastDate)selected=today;lastDate=today;render();}setInterval(refresh,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});render();
$('share').onclick=async()=>{const url=new URL('./',location.href).href;$('notice').textContent='';if(navigator.share){try{await navigator.share({title:'Emploi du temps d’Enzo',url});return;}catch(e){if(e.name==='AbortError')return;}}try{await navigator.clipboard.writeText(url);$('notice').textContent='Lien copié : colle-le dans ton message.';}catch(e){$('shareLink').value=url;$('shareLink').hidden=false;$('shareLink').focus();$('shareLink').select();$('notice').textContent='Copie ce lien pour le partager.';}};
let installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('install').hidden=false;});$('install').onclick=async()=>{if(!installPrompt)return;try{await installPrompt.prompt();await installPrompt.userChoice;}catch(e){$('notice').textContent='Utilise le menu de ton navigateur pour installer l’application.';}installPrompt=null;$('install').hidden=true;};window.addEventListener('appinstalled',()=>{$('install').hidden=true;$('notice').textContent='Application installée.';});
// Le mode hors connexion reste actif, sans bloc d’information en bas de page.
if('serviceWorker' in navigator&&window.isSecureContext){window.addEventListener('load',async()=>{try{const registration=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});await navigator.serviceWorker.ready;registration.update().catch(()=>{});}catch(e){console.warn('Mode hors connexion indisponible.',e);}});}
})();
</script>
</body>
</html>
